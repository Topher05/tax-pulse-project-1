AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TaxPulse SCRUM-160 Lambda + API Gateway integration.

Parameters:
  JwtIssuer:
    Type: String
    Description: Public HTTPS issuer URL that exposes OpenID Connect discovery and JWKS metadata.
  JwtAudience:
    Type: String
    Default: taxpulse-http-api
    Description: Audience required on TaxPulse serverless access tokens.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Architectures:
      - arm64

Resources:
  TaxPulseHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      Auth:
        Authorizers:
          SharedJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref JwtIssuer
              audience:
                - !Ref JwtAudience
        DefaultAuthorizer: SharedJwt

  PresentToClientFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../dist
      Handler: present-to-client-lambda/index.handler
      Description: Transition a Tax Plan Cycle from Review to Client Approval.
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        PresentToClientApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TaxPulseHttpApi
            Path: /v1/tax-plan-cycles/{caseId}/present-to-client
            Method: post
            PayloadFormatVersion: "2.0"

  ExecuteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../dist
      Handler: execute-lambda/index.handler
      Description: Transition a Tax Plan Cycle from Client Approval to Executed.
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        ExecuteApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref TaxPulseHttpApi
            Path: /v1/tax-plan-cycles/{caseId}/execute
            Method: post
            PayloadFormatVersion: "2.0"

Outputs:
  PresentToClientFunctionArn:
    Value: !GetAtt PresentToClientFunction.Arn
  ExecuteFunctionArn:
    Value: !GetAtt ExecuteFunction.Arn
  TaxPulseHttpApiUrl:
    Description: Base URL for the protected TaxPulse HTTP API.
    Value: !Sub "https://${TaxPulseHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod"
