[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-pulse-project-team-1"
version = "0.0.0"
description = "TaxPulse project workspace"
requires-python = "==3.13.14"

[project.optional-dependencies]
dev = [
  "pydantic>=2,<3",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
tax-pulse = "tax_pulse_project_team_1.main:main"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src/python"]

[tool.ruff]
line-length = 100
target-version = "py313"
