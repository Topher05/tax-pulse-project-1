[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-liability-engine"
version = "0.0.0"
description = "Tax liability engine workspace"
requires-python = "==3.13.14"
dependencies = [
  "boto3>=1.35,<2",
  "pydantic>=2,<3",
  "fastapi>=0.115,<1",
  "PyJWT>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.28,<1",
  "pact-python>=3,<4",
  "pyright[nodejs]>=1.1",
  "ruff>=0.8",
  "testcontainers[localstack]>=4.9,<5",
]

[project.scripts]
tax-pulse = "tax_liability_engine.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
python_files = ["*_test.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ANN"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  "dist",
  "node_modules",
]
pythonVersion = "3.13"
typeCheckingMode = "standard"
