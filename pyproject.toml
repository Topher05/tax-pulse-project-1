[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-pulse-project-team-1"
version = "0.0.0"
description = "TaxPulse project workspace"
requires-python = "==3.13.14"

[project.optional-dependencies]
dev = [
  "pydantic>=2,<3",
  "pytest>=8.0",
  "pyright[nodejs]>=1.1",
  "ruff>=0.8",
]

[project.scripts]
tax-pulse = "tax_pulse_project_team_1.main:main"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src/python"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ANN"]

[tool.pyright]
include = ["src/python", "tests/python"]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  "dist",
  "node_modules",
]
pythonVersion = "3.13"
typeCheckingMode = "standard"
