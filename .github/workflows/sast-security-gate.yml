name: SAST Security Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  sast-security-gate:
    name: SAST Security Gate
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep and Bandit
        run: python -m pip install --upgrade pip semgrep bandit

      - name: Run Semgrep
        run: semgrep scan --config auto --error --severity ERROR src/typescript

      - name: Run Bandit
        run: bandit --recursive src/tax_liability_engine --severity-level high
