name: Terraform Security Gate

on:
  pull_request:
    paths:
      - terraform/**
      - .github/workflows/terraform-security-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-security-gate:
    name: Terraform Security Gate
    runs-on: blacksmith-2vcpu-ubuntu-2404

    defaults:
      run:
        shell: bash
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without the remote backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install --upgrade pip checkov

      - name: Run Checkov
        run: checkov -d . --framework terraform --hard-fail-on HIGH --compact --quiet

      - name: Run tfsec
        run: docker run --rm -v "${{ github.workspace }}:/src" aquasec/tfsec-ci tfsec /src/terraform --minimum-severity HIGH --no-color
