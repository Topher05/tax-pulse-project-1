name: Container Scan & SBOM

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:
    inputs:
      premerge_zap_target_url:
        description: Optional deployed URL for a ZAP-only pre-merge validation run
        required: false
        type: string

concurrency:
  group: release-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: us-east-1
  CORE_CASE_REPOSITORY: taxpulse/core-case-service
  TAX_ENGINE_REPOSITORY: taxpulse/tax-engine
  RELEASE_WORKFLOW_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build-core-case:
    name: Build, Scan, SBOM & Sign Core Case
    if: github.event_name != 'workflow_dispatch' || inputs.premerge_zap_target_url == ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.release-metadata.outputs.image_ref || steps.local-metadata.outputs.image_ref }}
      digest: ${{ steps.release-build.outputs.digest || steps.local-metadata.outputs.digest }}
      repository: ${{ steps.release-metadata.outputs.repository || steps.local-metadata.outputs.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Configure AWS release credentials
        if: github.ref == 'refs/heads/development'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/development'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Record release image metadata
        if: github.ref == 'refs/heads/development'
        id: release-metadata
        shell: bash
        run: |
          IMAGE_REF="${{ steps.ecr-login.outputs.registry }}/${{ env.CORE_CASE_REPOSITORY }}:${GITHUB_SHA}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "repository=${{ steps.ecr-login.outputs.registry }}/${{ env.CORE_CASE_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        if: github.ref == 'refs/heads/development'
        id: release-build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          platforms: linux/arm64
          tags: ${{ steps.release-metadata.outputs.image_ref }}

      - name: Record local image metadata
        if: github.ref != 'refs/heads/development'
        id: local-metadata
        shell: bash
        run: |
          IMAGE_REF="taxpulse-core-case:${GITHUB_SHA}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "digest=local-only" >> "$GITHUB_OUTPUT"
          echo "repository=taxpulse-core-case" >> "$GITHUB_OUTPUT"

      - name: Build local scan image
        if: github.ref != 'refs/heads/development'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.local-metadata.outputs.image_ref }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.release-build.outputs.digest && format('{0}@{1}', steps.release-metadata.outputs.repository, steps.release-build.outputs.digest) || steps.local-metadata.outputs.image_ref }}
          format: table
          output: trivy-report-taxpulse-core-case.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Run Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.release-build.outputs.digest && format('{0}@{1}', steps.release-metadata.outputs.repository, steps.release-build.outputs.digest) || steps.local-metadata.outputs.image_ref }}
          format: json
          output: trivy-report-taxpulse-core-case.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Generate SBOM with Syft
        if: always()
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.release-build.outputs.digest && format('{0}@{1}', steps.release-metadata.outputs.repository, steps.release-build.outputs.digest) || steps.local-metadata.outputs.image_ref }}
          format: spdx-json
          output-file: sbom-taxpulse-core-case.spdx.json
          upload-artifact: false

      - name: Install Cosign
        if: github.ref == 'refs/heads/development'
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.0.6

      - name: Sign release image with Cosign
        if: github.ref == 'refs/heads/development'
        env:
          COSIGN_YES: "true"
        shell: bash
        run: |
          cosign sign "${{ steps.release-metadata.outputs.repository }}@${{ steps.release-build.outputs.digest }}"

      - name: Upload Trivy scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-taxpulse-core-case
          path: |
            trivy-report-taxpulse-core-case.txt
            trivy-report-taxpulse-core-case.json
          retention-days: 90

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-taxpulse-core-case
          path: sbom-taxpulse-core-case.spdx.json
          retention-days: 90

  build-tax-engine:
    name: Build, Scan, SBOM & Sign Tax Engine
    if: github.event_name != 'workflow_dispatch' || inputs.premerge_zap_target_url == ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.release-metadata.outputs.image_ref || steps.local-metadata.outputs.image_ref }}
      digest: ${{ steps.release-build.outputs.digest || steps.local-metadata.outputs.digest }}
      repository: ${{ steps.release-metadata.outputs.repository || steps.local-metadata.outputs.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Configure AWS release credentials
        if: github.ref == 'refs/heads/development'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/development'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Record release image metadata
        if: github.ref == 'refs/heads/development'
        id: release-metadata
        shell: bash
        run: |
          IMAGE_REF="${{ steps.ecr-login.outputs.registry }}/${{ env.TAX_ENGINE_REPOSITORY }}:${GITHUB_SHA}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "repository=${{ steps.ecr-login.outputs.registry }}/${{ env.TAX_ENGINE_REPOSITORY }}" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        if: github.ref == 'refs/heads/development'
        id: release-build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.tax-engine
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.release-metadata.outputs.image_ref }}

      - name: Record local image metadata
        if: github.ref != 'refs/heads/development'
        id: local-metadata
        shell: bash
        run: |
          IMAGE_REF="taxpulse-tax-engine:${GITHUB_SHA}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "digest=local-only" >> "$GITHUB_OUTPUT"
          echo "repository=taxpulse-tax-engine" >> "$GITHUB_OUTPUT"

      - name: Build local scan image
        if: github.ref != 'refs/heads/development'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.tax-engine
          push: false
          load: true
          tags: ${{ steps.local-metadata.outputs.image_ref }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.release-build.outputs.digest && format('{0}@{1}', steps.release-metadata.outputs.repository, steps.release-build.outputs.digest) || steps.local-metadata.outputs.image_ref }}
          format: table
          output: trivy-report-taxpulse-tax-engine.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Run Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.release-build.outputs.digest && format('{0}@{1}', steps.release-metadata.outputs.repository, steps.release-build.outputs.digest) || steps.local-metadata.outputs.image_ref }}
          format: json
          output: trivy-report-taxpulse-tax-engine.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Generate SBOM with Syft
        if: always()
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.release-build.outputs.digest && format('{0}@{1}', steps.release-metadata.outputs.repository, steps.release-build.outputs.digest) || steps.local-metadata.outputs.image_ref }}
          format: spdx-json
          output-file: sbom-taxpulse-tax-engine.spdx.json
          upload-artifact: false

      - name: Install Cosign
        if: github.ref == 'refs/heads/development'
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.0.6

      - name: Sign release image with Cosign
        if: github.ref == 'refs/heads/development'
        env:
          COSIGN_YES: "true"
        shell: bash
        run: |
          cosign sign "${{ steps.release-metadata.outputs.repository }}@${{ steps.release-build.outputs.digest }}"

      - name: Upload Trivy scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-taxpulse-tax-engine
          path: |
            trivy-report-taxpulse-tax-engine.txt
            trivy-report-taxpulse-tax-engine.json
          retention-days: 90

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-taxpulse-tax-engine
          path: sbom-taxpulse-tax-engine.spdx.json
          retention-days: 90

  verify-and-deploy:
    name: Verify Signatures & Deploy ECS
    if: github.ref == 'refs/heads/development'
    needs:
      - build-core-case
      - build-tax-engine
    outputs:
      spa_url: ${{ steps.deployed-spa.outputs.spa_url }}
      spa_index_sha256: ${{ steps.deployed-spa.outputs.spa_index_sha256 }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS release credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.0.6

      - name: Verify Core Case signature
        shell: bash
        run: |
          IMAGE_REF="${{ needs.build-core-case.outputs.repository }}@${{ needs.build-core-case.outputs.digest }}"
          RELEASE_WORKFLOW_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container-scan-sbom.yml@${GITHUB_REF}"
          test "${{ needs.build-core-case.outputs.digest }}" != "local-only"
          cosign verify \
            --certificate-identity "${RELEASE_WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer "${{ env.RELEASE_WORKFLOW_ISSUER }}" \
            "${IMAGE_REF}"

      - name: Verify Tax Engine signature
        shell: bash
        run: |
          IMAGE_REF="${{ needs.build-tax-engine.outputs.repository }}@${{ needs.build-tax-engine.outputs.digest }}"
          RELEASE_WORKFLOW_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container-scan-sbom.yml@${GITHUB_REF}"
          test "${{ needs.build-tax-engine.outputs.digest }}" != "local-only"
          cosign verify \
            --certificate-identity "${RELEASE_WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer "${{ env.RELEASE_WORKFLOW_ISSUER }}" \
            "${IMAGE_REF}"

      - name: Validate release digests differ from mutable tags
        shell: bash
        run: |
          test "${{ needs.build-core-case.outputs.repository }}@${{ needs.build-core-case.outputs.digest }}" != "${{ needs.build-core-case.outputs.image_ref }}"
          test "${{ needs.build-tax-engine.outputs.repository }}@${{ needs.build-tax-engine.outputs.digest }}" != "${{ needs.build-tax-engine.outputs.image_ref }}"

      - name: Initialize Terraform backend
        shell: bash
        run: terraform -chdir=terraform init -input=false

      - name: Install Pulse UI dependencies
        shell: bash
        run: npm ci --prefix src/pulseUI

      - name: Build Pulse UI
        shell: bash
        run: npm run build:web

      - name: Resolve Terraform runtime configuration
        id: runtime-config
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_CONFIG_SECRET_ARN="$(terraform -chdir=terraform output -raw runtime_config_secret_arn)"

          if [[ ! "$RUNTIME_CONFIG_SECRET_ARN" =~ ^arn:aws:secretsmanager:${AWS_REGION}:[0-9]{12}:secret:taxpulse-dev-runtime-config- ]]; then
            echo "Terraform returned an unexpected runtime secret ARN: $RUNTIME_CONFIG_SECRET_ARN" >&2
            exit 1
          fi

          aws secretsmanager describe-secret --secret-id "$RUNTIME_CONFIG_SECRET_ARN" >/dev/null

          echo "secret_arn=$RUNTIME_CONFIG_SECRET_ARN" >> "$GITHUB_OUTPUT"

      - name: Resolve canonical ECS task definitions
        shell: bash
        run: |
          set -euo pipefail
          CORE_CASE_TASK_DEFINITION_ARN="$(
            terraform -chdir=terraform show -json |
              jq -er '.. | objects | select(.address? == "module.ecs_services.aws_ecs_task_definition.core_case") | .values.arn'
          )"
          TAX_ENGINE_TASK_DEFINITION_ARN="$(
            terraform -chdir=terraform show -json |
              jq -er '.. | objects | select(.address? == "module.ecs_services.aws_ecs_task_definition.tax_engine") | .values.arn'
          )"

          [[ "$CORE_CASE_TASK_DEFINITION_ARN" == arn:aws:ecs:${AWS_REGION}:*:task-definition/taxpulse-core-case-service:* ]]
          [[ "$TAX_ENGINE_TASK_DEFINITION_ARN" == arn:aws:ecs:${AWS_REGION}:*:task-definition/taxpulse-tax-engine:* ]]

          aws ecs describe-task-definition \
            --task-definition "$CORE_CASE_TASK_DEFINITION_ARN" \
            --query taskDefinition \
            --output json |
            jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )' > deployment/ecs/core-case-service.canonical.json

          aws ecs describe-task-definition \
            --task-definition "$TAX_ENGINE_TASK_DEFINITION_ARN" \
            --query taskDefinition \
            --output json |
            jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )' > deployment/ecs/tax-engine.canonical.json

      - name: Inject Terraform runtime secret into task definitions
        shell: bash
        env:
          RUNTIME_CONFIG_SECRET_ARN: ${{ steps.runtime-config.outputs.secret_arn }}
        run: |
          set -euo pipefail
          jq --arg arn "$RUNTIME_CONFIG_SECRET_ARN" '
            def secret($name): {name: $name, valueFrom: ($arn + ":" + $name + "::")};
            (.containerDefinitions[] | select(.name == "core-case-service") | .secrets) = [
              secret("DATABASE_URL"),
              secret("JWT_SIGNING_PRIVATE_KEY"),
              secret("JWT_SIGNING_KEY_ID"),
              secret("JWT_SIGNING_SECRET"),
              secret("ASSIST_TENANT_CORPUS_SCOPE_MAP"),
              secret("OPENAI_API_KEY")
            ]
          ' deployment/ecs/core-case-service.canonical.json > core-case-service.rendered.json
          mv core-case-service.rendered.json deployment/ecs/core-case-service.canonical.json

          jq --arg arn "$RUNTIME_CONFIG_SECRET_ARN" '
            def secret($name): {name: $name, valueFrom: ($arn + ":" + $name + "::")};
            (.containerDefinitions[] | select(.name == "tax-engine") | .secrets) = [
              secret("JWT_SIGNING_SECRET")
            ]
          ' deployment/ecs/tax-engine.canonical.json > tax-engine.rendered.json
          mv tax-engine.rendered.json deployment/ecs/tax-engine.canonical.json

          jq -e --arg arn "$RUNTIME_CONFIG_SECRET_ARN" '
            [.containerDefinitions[] | select(.name == "core-case-service") | .secrets[]]
            | length == 6 and all(.valueFrom | startswith($arn + ":"))
          ' deployment/ecs/core-case-service.canonical.json >/dev/null
          jq -e --arg arn "$RUNTIME_CONFIG_SECRET_ARN" '
            [.containerDefinitions[] | select(.name == "tax-engine") | .secrets[]]
            | length == 1 and all(.valueFrom | startswith($arn + ":"))
          ' deployment/ecs/tax-engine.canonical.json >/dev/null

      - name: Render Core Case task definition
        id: render-core-case
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deployment/ecs/core-case-service.canonical.json
          container-name: core-case-service
          image: ${{ needs.build-core-case.outputs.repository }}@${{ needs.build-core-case.outputs.digest }}

      - name: Render Tax Engine task definition
        id: render-tax-engine
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deployment/ecs/tax-engine.canonical.json
          container-name: tax-engine
          image: ${{ needs.build-tax-engine.outputs.repository }}@${{ needs.build-tax-engine.outputs.digest }}

      - name: Deploy Core Case service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          cluster: taxpulse-api
          service: core-case-service
          task-definition: ${{ steps.render-core-case.outputs.task-definition }}
          wait-for-service-stability: true

      - name: Deploy Tax Engine service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          cluster: taxpulse-api
          service: tax-engine
          task-definition: ${{ steps.render-tax-engine.outputs.task-definition }}
          wait-for-service-stability: true

      - name: Capture ECS deployment diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          aws ecs describe-services \
            --cluster taxpulse-api \
            --services core-case-service tax-engine \
            --query 'services[].{service:serviceName,taskDefinition:taskDefinition,deployments:deployments,events:events[0:10]}' \
            --output json

          for service in core-case-service tax-engine; do
            STOPPED_TASKS="$(aws ecs list-tasks \
              --cluster taxpulse-api \
              --service-name "$service" \
              --desired-status STOPPED \
              --max-items 10 \
              --query 'taskArns' \
              --output text)"
            if [[ -n "$STOPPED_TASKS" && "$STOPPED_TASKS" != "None" ]]; then
              aws ecs describe-tasks \
                --cluster taxpulse-api \
                --tasks $STOPPED_TASKS \
                --query 'tasks[].{task:taskArn,taskDefinition:taskDefinitionArn,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' \
                --output json
            fi
          done

      - name: Deploy and verify Pulse UI
        id: deployed-spa
        shell: bash
        run: |
          set -euo pipefail
          SPA_BUCKET="$(terraform -chdir=terraform output -raw spa_bucket_name)"
          CLOUDFRONT_DISTRIBUTION_ID="$(terraform -chdir=terraform output -raw cloudfront_distribution_id)"
          SPA_URL="$(terraform -chdir=terraform output -raw spa_url)"
          [[ "$SPA_BUCKET" =~ ^taxpulse-dev-[0-9]{12}-spa$ ]]
          [[ "$CLOUDFRONT_DISTRIBUTION_ID" =~ ^[A-Z0-9]+$ ]]
          [[ "$SPA_URL" =~ ^https://.+$ ]]

          aws s3 sync dist/pulseUI "s3://$SPA_BUCKET" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html
          aws s3 cp dist/pulseUI/index.html "s3://$SPA_BUCKET/index.html" \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --content-type text/html

          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' \
            --query Invalidation.Id \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

          EXPECTED_SHA256="$(sha256sum dist/pulseUI/index.html | cut -d' ' -f1)"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${SPA_URL}?release=${GITHUB_SHA}" \
            --output deployed-index.html
          ACTUAL_SHA256="$(sha256sum deployed-index.html | cut -d' ' -f1)"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "Deployed SPA index digest mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256" >&2
            exit 1
          fi

          echo "spa_url=${SPA_URL}" >> "$GITHUB_OUTPUT"
          echo "spa_index_sha256=${EXPECTED_SHA256}" >> "$GITHUB_OUTPUT"

  zap-baseline:
    name: OWASP ZAP Baseline Scan
    needs: verify-and-deploy
    uses: ./.github/workflows/zap-baseline.yml
    with:
      target_url: ${{ needs.verify-and-deploy.outputs.spa_url }}

  premerge-zap-baseline:
    name: Pre-merge OWASP ZAP Baseline Scan
    if: github.event_name == 'workflow_dispatch' && inputs.premerge_zap_target_url != ''
    uses: ./.github/workflows/zap-baseline.yml
    with:
      target_url: ${{ inputs.premerge_zap_target_url }}

  release-evidence:
    name: Release Evidence Manifest
    if: github.ref == 'refs/heads/development'
    needs:
      - build-core-case
      - build-tax-engine
      - verify-and-deploy
      - zap-baseline
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Write release evidence manifest
        env:
          CORE_CASE_REPOSITORY: ${{ needs.build-core-case.outputs.repository }}
          CORE_CASE_DIGEST: ${{ needs.build-core-case.outputs.digest }}
          TAX_ENGINE_REPOSITORY: ${{ needs.build-tax-engine.outputs.repository }}
          TAX_ENGINE_DIGEST: ${{ needs.build-tax-engine.outputs.digest }}
          SPA_URL: ${{ needs.verify-and-deploy.outputs.spa_url }}
          SPA_INDEX_SHA256: ${{ needs.verify-and-deploy.outputs.spa_index_sha256 }}
        shell: python
        run: |
          import json
          import os

          github_server_url = os.environ["GITHUB_SERVER_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          manifest = {
              "release_commit_sha": sha,
              "commit_checks_url": f"{github_server_url}/{repository}/commit/{sha}/checks",
              "actions_run_url": f"{github_server_url}/{repository}/actions/runs/{run_id}",
              "deployed_spa_url": os.environ["SPA_URL"],
              "ui_source_commit_sha": sha,
              "deployed_spa_index_sha256": os.environ["SPA_INDEX_SHA256"],
              "images": [
                  {
                      "name": "core-case",
                      "repository": os.environ["CORE_CASE_REPOSITORY"],
                      "digest": os.environ["CORE_CASE_DIGEST"],
                      "immutable_ref": f"{os.environ['CORE_CASE_REPOSITORY']}@{os.environ['CORE_CASE_DIGEST']}",
                  },
                  {
                      "name": "tax-engine",
                      "repository": os.environ["TAX_ENGINE_REPOSITORY"],
                      "digest": os.environ["TAX_ENGINE_DIGEST"],
                      "immutable_ref": f"{os.environ['TAX_ENGINE_REPOSITORY']}@{os.environ['TAX_ENGINE_DIGEST']}",
                  },
              ],
              "artifacts": [
                  "trivy-report-taxpulse-core-case",
                  "sbom-taxpulse-core-case",
                  "trivy-report-taxpulse-tax-engine",
                  "sbom-taxpulse-tax-engine",
                  "zap-baseline-reports",
                  "release-evidence-manifest",
              ],
          }
          with open("release-evidence-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")

      - name: Upload release evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-manifest
          path: release-evidence-manifest.json
          retention-days: 90
